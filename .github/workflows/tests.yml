# Tests and lint.
#
# This repository had house-rules CI before it had test CI, and a red suite sat
# in it unnoticed as a result: the unittest runner used by these modules aborts
# without printing a total, so tailing its output looks identical to a pass.
# That is the reason the "Unit tests" step below runs pytest with an explicit
# exit code rather than reading the tail of a log, and the reason "Demos" runs
# `make all`, which propagates a non-zero exit from any single demo.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Demos, each scored against its own plant
        # Every demo prints PASS or FAIL against planted ground truth and exits
        # non-zero on FAIL. This is the step that would have caught the
        # vocab_vlm escalation gate reporting savings for a branch nothing took.
        run: make all PYTHON=python

      - name: No demo silently stopped scoring
        # A demo that crashes early can still leave `make all` green if its own
        # exit code is swallowed by a pipe. Count the verdicts instead.
        run: |
          make all PYTHON=python > demo_output.txt 2>&1
          verdicts=$(grep -cE "^\s+(PASS|FAIL):" demo_output.txt || true)
          echo "verdicts printed: $verdicts"
          if [ "$verdicts" -lt 7 ]; then
            echo "expected at least 7 scored demos, saw $verdicts"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        # Same rule set the sibling plr-lab-robot repository enforces, so a
        # contributor moving between them meets one standard rather than two.
        run: ruff check --select E4,E7,E9,F --line-length 100 .
